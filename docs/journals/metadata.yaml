  launcher-window-concept-2.jpg:
    description: "Refined iteration of the launcher window concept with updated interface ideas."
    status: "Historical"
  navigation-system-design.jpg:
    description: "Documents the navigation model used throughout the user interface, including movement between screens and interaction patterns."
    status: "Implemented"
  renderer-pipeline-notes.jpg:
    description: "Notes describing the rendering pipeline used by the terminal interface renderer."
    status: "Implemented"
  terminal-layout-grid.jpg:
    description: "Defines the terminal screen layout using character-based regions such as the header, body, and footer."
    status: "Implemented"
  tui-component-architecture.jpg:
    description: "Illustrates the architectural relationships between the core components of the original terminal interface engine."
    status: "Implemented"
  tui-layout-and-renderer.jpg:
    description: "Documents the early design of the terminal layout manager, renderer, and global configuration system."
    status: "Implemented"
  tui-runtime-cycle.jpg:
    description: "Describes the runtime cycle of the original terminal interface, including initialization, execution, and shutdown."
    status: "Implemented"
  credential-api-finalization.jpg:
    description: "Finalizes the credential API design by comparing all explored approaches and selecting the unified architecture based on consistency, usability, and separation of responsibilities."
    status: "Abandoned"
  credential-method-1-overview.jpg:
    description: "Introduces the first credential architecture, where mode-specific credential objects are created and managed explicitly by the caller before interacting with the engine."
    status: "Historical"
  credential-method-2-overview.jpg:
    description: "Explores a layered credential management approach that hides mode-specific implementation details behind a centralized credential management interface."
    status: "Historical"
  credential-method-3-details.jpg:
    description: "Refines the third credential architecture by defining a unified entry point that returns mode-specific credential objects with their own specialized operations and parameter requirements."
    status: "Abandoned"
  credential-method-3-origin.jpg:
    description: "Documents the reasoning process that led to the Unified Space Method, examining how mode selection can simplify the public API while preserving internal flexibility."
    status: "Superseded"
  credential-methods-comparasion-1.jpg:
    description: "Compares the first and second credential API designs, evaluating their workflow complexity, user responsibilities, and overall developer experience."
    status: "Historical"
  credential-methods-comparasion-2.jpg:
    description: "Continues the comparison by introducing additional alternatives, refining the unified design, and documenting the architectural reasoning behind the final decision."
    status: "Historical"
  credential-workflow-exploration.jpg:
    description: "Explores the initial credential workflow and evaluates different architectural approaches for exposing Standard and Ledger credential operations through the public API."
    status: "Superseded"
  credential-methods-tradeoffs.jpg:
    description: "Evaluates the trade-offs between the remaining credential API designs, comparing developer experience, internal architecture, and design philosophy before choosing the final approach."
    status: "Historical"
  credential-unknown-discovery.jpg:
    description: "Explores the limitations of implementing a unified credential API in C++, examining function overloading, mode-dependent parameter handling, and compile-time type constraints that influenced the final architecture."
    status: "Abandoned"
  credential-context-realization.jpg:
    description: "Explores a context-based credential API and examines whether a shared context object can unify mode-specific operations, ultimately recognizing its limitations due to differing parameter and return-type requirements across credential workflows."
    status: "Abandoned"
  credential-explored-methods.jpg:
    description: "Summarizes all explored credential API designs and evaluates their architectural trade-offs, concluding with the Modularity Method as the most stable solution based on API simplicity, maintainability, scalability, mode isolation, and internal modularity."
    status: "Implemented"
    featured: "Summarizes every explored credential architecture and explains why the Modularity Method became the foundation of the RepX credential API."
  modes-classes-origin.jpg:
    description: "Documents the origin of mode-specific credential classes and their integration into the RepX API, introducing dedicated implementations for Ledger and Standard modes alongside the corresponding source tree organization."
    status: "Historical"
  modularity-method-origin.jpg:
    description: "Documents the initial design of the Modularity Method, exploring how mode-specific credential operations can be exposed through dedicated API objects while preserving a unified and extensible credential architecture."
    status: "Historical"
    featured: Introduces the Modularity Method and its initial API structure, establishing the foundation for RepX's mode-specific credential architecture.
  repx-implementation-diversion.jpg:
    description: "Explores how the Project API should internally diverge into mode-specific implementations while preserving a unified public interface."
    status: "Historical"
  repx-diversion-solution-1.jpg:
    description: "Explores the first solution for mode-specific project implementations by extending the Modularity Method across the engine, exposing mode-specific operations while evaluating their architectural trade-offs."
    status: "Abandoned"
  repx-diversion-solution-2.jpg:
    description: "Explores an alternative Context Registry Method that encapsulates mode-specific data within context objects, allowing RepX systems to expose a unified public API while selecting implementations internally."
    status: "Abandoned"
  repx-philosophy-upgrade.jpg:
    description: "Reframes the relationship between the RepX API and RepX Engine by separating interface from philosophy, establishing the engine as the implementation of RepX's design principles through independently responsible execution modes."
    status: "Implemented"
    featured: "Introduces one of RepX's core architectural philosophies by distinguishing the API as a communication interface and the Engine as the implementation of RepX's design philosophy through independent execution modes."
  api-architecture-exploration-1.jpg:
    description: "Explores multiple experimental API architectures for exposing mode-specific functionality across the RepX engine, evaluating approaches such as persistent mode selection, mode accessors, and global context before they were discarded."
    status: "Abandoned"
  api-architecture-exploration-2.jpg:
    description: "Continues the exploration of alternative API architectures by experimenting with context-based workflows and mode-specific objects to understand their impact on usability, responsibility distribution, and long-term maintainability."
    status: "Abandoned"
  context-registry-finalization.jpg:
    description: "Finalizes the Context Registry Method by defining a centralized registry of mode-specific contexts that enables a unified public API while internally dispatching operations to the appropriate mode implementations."
    status: "Implemented"
  workflow-amendment-timeline-1.jpg:
    description: "Documents the beginning of the API workflow evolution by identifying the scalability limitations of the Modularity Method and motivating the search for a more maintainable architecture as RepX expanded."
    status: "Historical"
  workflow-amendment-timeline-2.jpg:
    description: "Continues the API workflow evolution by introducing the Context Registry Method, comparing it against the earlier Object Method, and evaluating the architectural improvements it provides."
    status: "Historical"
  workflow-amendment-timeline-3.jpg:
    description: "Explains how the Context Registry Method operates internally by centralizing mode-specific contexts, delegating operations to their respective implementations, and establishing the engine as the system orchestrator."
    status: "Historical"
  workflow-amendment-timeline-4.jpg:
    description: "Concludes the API workflow evolution by summarizing the advantages of the Context Registry Method and finalizing its adoption as the architectural direction for unifying RepX's public API."
    status: "Historical"
  context-type-dispatch-exploration.jpg:
    description: "Explores using mode-specific context types as an implicit dispatch mechanism, allowing the engine to automatically route operations to the appropriate mode implementation based solely on the received context object."
    status: "Historical"
  context-namespace-organization.jpg:
    description: "Defines the organization of the Context subsystem, establishing Context as the parent namespace responsible for managing all mode-specific context objects while allowing each mode to own and maintain its own implementations."
    status: "Partially Implemented"
  registry-resolver-pair-architecture.jpg:
    description: "Defines the Context Registry and Context Resolver architecture, establishing the communication layer between the API and the engine by separating context construction from mode-specific implementation resolution."
    status: "Partially Implemented"
  registry-resolver-roles.jpg:
    description: "Defines the respective responsibilities of the Context Registry and Context Resolver, explaining how user-defined contexts are interpreted and transformed into mode-specific implementations for engine orchestration."
    status: "Superseded"
    featured: "Introduces the Registry-Resolver architecture, one of RepX's core abstractions that decouples the public API from mode implementations while preserving a unified API language."
  context-registry-concept-1.jpg:
    description: "Defines the structure of the Context Registry by organizing mode-specific context definitions into dedicated headers and exposing them through a unified Context namespace for API users."
    status: "Superseded"
  context-registry-concept-2.jpg:
    description: ""
    status: "Superseded"
  context-resolver-concept-1.jpg:
    description: "Explores the concept of the Context Resolver, introducing how context objects supplied through the Context Registry are interpreted and translated into mode-specific implementation objects for the engine."
    status: "Implemented"
  context-resolver-concept-2.jpg:
    description: ""
    status: "Implemented"
  context-metadata-exploration.jpg:
    description: "Explores embedding mode information directly into context types using template-based metadata, evaluating compile-time context identification as an alternative to the Context Registry and Resolver architecture."
    status: "Implemented"
  context-mode-mapping-exploration.jpg:
    description: "Explores mechanisms for mapping context types to their corresponding mode implementations, investigating how the engine can associate mode-specific context structures with the appropriate runtime without explicit user intervention."
    status: "Superseded"
  template-context-resolution-exploration.jpg:
    description: "Explores using template-based metadata to implicitly associate context types with their corresponding modes, investigating whether compile-time templates could replace the Context Registry and Context Resolver architecture."
    status: "Implemented"
  resolver-template-mechanics-1.jpg:
    description: "Explores how dependent types and type aliases can be used within templates to expose mode-specific type information required by the Context Resolver."
    status: "Educational"
  resolver-template-mechanics-2.jpg:
    description: "Documents the role of the `typename` keyword in dependent names, explaining how template-based type retrieval enables compile-time access to mode information."
    status: "Educational"
  resolver-template-mechanics-3.jpg:
    description: "Applies dependent type retrieval to the Context Resolver architecture, exploring compile-time extraction of mode-specific types from context metadata."
    status: "Educational"
  project-lifecycle-return-model-1.jpg:
    description: "Explores the architectural contradiction surrounding the Engine's responsibility in returning public Project objects while remaining only an orchestration layer."
    status: "Finalized"
  project-lifecycle-return-model-2.jpg:
    description: "Investigates ownership boundaries between the Engine, ProjectManager, Project, and mode-specific implementations, ultimately defining the return contract expected by API consumers."
    status: "Finalized"
  project-object-session-architecture-1.jpg:
    description: "Introduces the final architectural direction for Project and ProjectManager, identifying the ownership contradiction between the Engine and mode implementations."
    status: "Implemented"
  project-object-session-architecture-2.jpg:
    description: "Resolves the ownership model by establishing that mode implementations return their Project object to the Engine, which transparently exposes it through the public API."
    status: "Implemented"
  project-object-session-architecture-3.jpg:
    description: "Defines the Session as the runtime state returned by mode-specific project creation and establishes it as the core object encapsulated by the public Project abstraction."
    status: "Implemented"
  project-object-session-architecture-4.jpg:
    description: "Finalizes the project lifecycle by defining create() as a wrapper over the complete project opening pipeline, ensuring newly created projects are immediately opened through the same validation flow."
    status: "Implemented"
  project-object-session-architecture-5.jpg:
    description: "Extends the finalized delegation architecture to CredentialManager, completing the unified mode-dispatch structure for project and credential operations while preserving a single Engine-facing API."
    status: "Implemented"
  engine-mode-session-wrapper.jpg:
    description: "Finalizes the Engine-mode interaction model, resolving the create()/open() dependency and establishing Session as the mode-owned object behind the unified Project API."
    status: "Finalized"