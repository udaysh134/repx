    description: "Defines the structure and responsibilities of the credential object used by the RepX engine."
    status: "Partially Implemented"
  permission-scope-design.jpg:
    description: "Documents the permission scope model governing credential capabilities and authorization boundaries."
  engine-folder-structure.jpg:
