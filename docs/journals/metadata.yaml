  repx-core-api-sketch.jpg:
    description: "Early sketch of the core RepX engine API, exploring the primary interfaces exposed by the engine."
    status: "Superseded"
  ledger-cryptographic-pipeline.jpg:
    description: "Defines the Ledger Mode cryptographic pipeline, including canonicalization, canonical strings, hashing, and digital signatures."
    status: "Implemented"
    featured: "Explains the cryptographic trust pipeline that enables Ledger Mode to produce tamper-resistant, verifiable, and cryptographically authenticated reputation records."
  ledger-record-schema.jpg:
    description: "Defines the schema and organization of ledger records used within Ledger Mode."
