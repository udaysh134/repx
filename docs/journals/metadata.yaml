    description: "Documents runtime concepts, behaviors, and implementation notes for the shared RepX engine."
    status: "Partially Implemented"
  engine-source-tree.jpg:
    description: "Defines the source tree organization of the RepX engine, including the arrangement of source files and directories."
    status: "Implemented"
