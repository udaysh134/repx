version: 2
files:
  credential-origin-concept.jpg:
    description: "Documents the earliest concept of the credential system, including the initial ideas behind credential generation and key sharing before the subsystem was formally defined."
    status: "Partially Implemented"
    featured: "Captures the birth of the RepX credential system, recording the earliest concepts that ultimately evolved into the current credential architecture."
  engine-development-roadmap-1.jpg:
    description: "Records the first implementation roadmap used while developing the original RepX engine, outlining the planned development milestones and design progression."
    status: "Historical"
  engine-development-roadmap-2.jpg:
    description: "Continues the original engine development roadmap, capturing the subsequent implementation stages and evolving design decisions."
    status: "Historical"
  identity-model-concept.jpg:
    description: "Explores the early identity model by designing the intended leaderboard output and deriving the data required to support it, ultimately shaping the identity system."
    status: "Partially Implemented"
    featured: "Captures the birth of RepX's identity model by working backwards from the intended leaderboard output while introducing PAAF-C and LRRS as the project's foundational guiding philosophy."
  repx-core-principles.jpg:
    description: "Defines the foundational principles of RepX, including the immutable reputation model, cryptographic authenticity, and the initial separation of Standard Mode and Ledger Mode."
    status: "Partially Implemented"
    featured: "Defines the core philosophy of RepX by establishing its foundational engineering principles, introducing the deliberate +1/-1 reputation philosophy, and shaping the project's architecture, security model, and long-term evolution."
  application-flow-concept.jpg:
    description: "Explores the conceptual application flow, mapping how users navigate through major operations such as creating projects, opening existing ones, and generating outputs."
    status: "Superseded"
    featured: "Captures the original application flow that established the user journey through RepX before it evolved into the current workflow."
